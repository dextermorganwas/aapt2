services:
  art-bridge:
    image: ghcr.io/YOUR_GITHUB_USERNAME/stremio-art-bridge:latest
    container_name: stremio-art-bridge
    restart: unless-stopped
    network_mode: host
    cpus: ${CPU_LIMIT:-1.0}
    mem_limit: ${MEMORY_LIMIT:-512m}
    pids_limit: ${PIDS_LIMIT:-128}
    env_file:
      - .env
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/art-proxy:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8990)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
