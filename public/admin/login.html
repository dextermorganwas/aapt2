<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Bridge · Sign in</title><style>body{background:#111827;color:#e5e7eb;font:16px system-ui,sans-serif}main{background:#1f2937;border-radius:12px}input,button{display:block;width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #4b5563}input{background:#111827;color:#fff}button{background:#374151;color:#fff;cursor:pointer}.error{color:#fca5a5}.hidden{display:none}</style></head>
<body><main style="max-width:420px;margin:10vh auto;padding:24px"><h1>Art Bridge</h1><h2>Sign in</h2><form id="login"><label>Username<input name="username" autocomplete="username" required></label><label style="display:block;margin-top:12px">Password<input name="password" type="password" autocomplete="current-password" required></label><button style="margin-top:16px" type="submit">Sign in</button><p id="error" class="toast error hidden"></p></form></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});if(r.ok)location.href='/admin';else{const j=await r.json().catch(()=>({}));const x=document.getElementById('error');x.textContent=j.error||'Sign in failed';x.classList.remove('hidden');}});
</script></body></html>
